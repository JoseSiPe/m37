[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m37"
version = "0.2.0"
description = "Move 37 (M37) — Task-agnostic multi-model agentic microkernel"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "José Carlos Sierra" }
]
dependencies = [
    "litellm>=1.50.0",
    "pydantic>=2.7.0",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "markdown>=3.6",
]

[project.optional-dependencies]
full = [
    "duckdb>=1.1.0",
    "fastmcp>=0.4.0",
]
data = [
    "polars>=1.5.0",
    "pyarrow>=17.0.0",
    "trafilatura>=1.12.0",
]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[project.scripts]
m37 = "m37.cli:app"
m37-mcp = "m37.mcp_server:run_stdio_server"

# M7: starter_vault/ y extensions/ viajan dentro del wheel como datos del paquete (m37/_starter_vault, m37/_extensions),
# de modo que `pip install m37` funcione sin el checkout del repositorio. En el repo siguen viviendo en la raíz.
[tool.setuptools]
packages = ["m37", "m37._starter_vault", "m37._extensions"]

[tool.setuptools.package-dir]
"m37" = "src/m37"
"m37._starter_vault" = "starter_vault"
"m37._extensions" = "extensions"

[tool.setuptools.package-data]
"m37._starter_vault" = ["**/*"]
"m37._extensions" = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "**/__pycache__/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = [
    "strict_isolation: el test verifica la regla de un cliente por workspace y no recibe la excepción de compatibilidad",
]
